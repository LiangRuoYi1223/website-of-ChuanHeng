services:
  - type: web
    name: chuanheng-website
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build:cloud
    startCommand: npm run start:cloud
    healthCheckPath: /api/site-status
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: chuanheng-uploads
